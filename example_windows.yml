spectral_windows:

  window1:
    wavelength_unit: nm
    wavelength_min: 4450.0
    wavelength_max: 4550.0
    wavelength_ref: 4500.0
    wavelength_buffer: 2.0
    # Note: to set a constant SNR for all spectral points
    # simply set `snr_a` to 0, and `snr_b` to (desired SNR)^2
    snr_a: 2500.0
    snr_b: 2500.0

gases:
  - CO2
  - H2O

instrument:
  spectral_sampling: 0.10
  FWHM: 0.30
  unit: nm

viewing_zenith: 15.0
viewing_azimuth: 0.0

longitude: -93.3
latitude: 45.0
elevation: 80.0m
surface_pressure: 985.0hPa